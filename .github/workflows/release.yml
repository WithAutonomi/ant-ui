name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ant_version:
        description: "ant-client release tag to bundle (e.g. ant-cli-v0.1.2-rc.17). Leave empty to use the latest ant-client release."
        required: false

env:
  CARGO_TERM_COLOR: always
  # Opt JS-based actions onto Node 24 ahead of the 2026-06-02 forced-default
  # switch. Without this, `actions/upload-artifact@v5`, `actions/download-artifact@v5`,
  # and `digicert/ssm-code-signing@v1.2.1` emit deprecation warnings on every
  # run and would break outright after Node 20 is removed on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release-meta:
    name: determine release type
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: parse tag
        id: meta
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          if [[ "$version" == *"-rc."* ]] || [[ "$version" == *"-beta."* ]] || [[ "$version" == *"-alpha."* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Tag: $tag"
          echo "Version: $version"
          echo "Prerelease: $(grep prerelease $GITHUB_OUTPUT | cut -d= -f2)"

  resolve-ant-version:
    name: resolve ant sidecar version
    runs-on: ubuntu-latest
    outputs:
      ant_tag: ${{ steps.resolve.outputs.ant_tag }}
      ant_version: ${{ steps.resolve.outputs.ant_version }}
    steps:
      - uses: actions/checkout@v5

      - name: resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Priority: workflow_dispatch input > latest ant-client release
          INPUT="${{ github.event.inputs.ant_version }}"

          if [ -n "$INPUT" ]; then
            TAG="$INPUT"
            echo "Source: workflow_dispatch input"
          else
            TAG=$(gh release list --repo WithAutonomi/ant-client --limit 1 --json tagName --jq '.[0].tagName')
            echo "Source: latest ant-client release ($TAG)"
          fi

          # Extract version number (strip ant-cli-v prefix)
          VERSION="${TAG#ant-cli-v}"

          echo "ant_tag=$TAG" >> $GITHUB_OUTPUT
          echo "ant_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using ant sidecar: $TAG (version: $VERSION)"

  build-linux-macos:
    name: build (${{ matrix.args && matrix.args || matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: [release-meta, resolve-ant-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            slug: linux
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            slug: macos-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            slug: macos-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: install linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: generate macOS icon from iconset
        if: matrix.platform == 'macos-latest'
        run: |
          iconutil -c icns src-tauri/icons/autonomi.iconset -o src-tauri/icons/icon.icns

      - run: npm install

      - name: download ant daemon sidecar
        env:
          ANT_VERSION: ${{ needs.resolve-ant-version.outputs.ant_version }}
          ANT_TAG: ${{ needs.resolve-ant-version.outputs.ant_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine Tauri target triple
          CROSS_TARGET=$(echo "${{ matrix.args }}" | sed -n 's/.*--target \([^ ]*\).*/\1/p')
          if [ -z "$CROSS_TARGET" ]; then
            CROSS_TARGET=$(rustc -vV | grep host | awk '{print $2}')
          fi

          # ant-client publishes musl builds for Linux
          ANT_TARGET="${CROSS_TARGET/unknown-linux-gnu/unknown-linux-musl}"

          ASSET="ant-${ANT_VERSION}-${ANT_TARGET}.tar.gz"
          echo "Downloading $ASSET from $ANT_TAG"

          mkdir -p src-tauri/binaries
          gh release download "$ANT_TAG" \
            --repo WithAutonomi/ant-client \
            --pattern "$ASSET" \
            --dir /tmp

          tar xzf "/tmp/$ASSET" -C /tmp
          cp "/tmp/ant-${ANT_VERSION}-${ANT_TARGET}/ant" "src-tauri/binaries/ant-${CROSS_TARGET}"
          chmod +x "src-tauri/binaries/ant-${CROSS_TARGET}"
          echo "Sidecar ready: src-tauri/binaries/ant-${CROSS_TARGET}"

          # Bundle the bootstrap_peers.toml that ships with this daemon version
          # so the GUI's embedded ant-core client can connect on a fresh install.
          mkdir -p src-tauri/resources
          cp "/tmp/ant-${ANT_VERSION}-${ANT_TARGET}/bootstrap_peers.toml" \
             "src-tauri/resources/bootstrap_peers.toml"
          echo "Bootstrap peers refreshed from $ANT_TAG"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Build only — no release upload. The publish-release job downloads
          # the artifacts uploaded below and creates the release at the end.
          args: ${{ matrix.args }}

      - name: repair AppImage sidecar (static-pie workaround)
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # linuxdeploy + its plugins run strip/patchelf over every executable
          # in AppDir/usr/bin/ during AppImage packaging. That corrupts
          # static-pie musl binaries like `ant` (segfault before `main`).
          # macOS/Windows bundlers don't touch sidecars, and `.deb`/`.rpm`
          # don't go through linuxdeploy, so only AppImage breaks. Workaround:
          # extract the produced AppImage, overwrite the mangled sidecar
          # with the pristine binary we already downloaded, repack, then
          # re-sign for the updater so the .sig matches the repaired file.

          APPIMAGE=$(realpath "$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)")
          PRISTINE=$(realpath src-tauri/binaries/ant-x86_64-unknown-linux-gnu)

          echo "Repairing: $APPIMAGE"
          echo "Pristine ant: $(stat -c%s "$PRISTINE") bytes"

          work=$(mktemp -d)
          pushd "$work" >/dev/null
          "$APPIMAGE" --appimage-extract >/dev/null
          echo "Mangled ant in AppImage: $(stat -c%s squashfs-root/usr/bin/ant) bytes"

          cp -f "$PRISTINE" squashfs-root/usr/bin/ant
          chmod +x squashfs-root/usr/bin/ant

          # GH runners don't have FUSE, so AppImages must be run with
          # --appimage-extract-and-run.
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

          rm "$APPIMAGE"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            squashfs-root "$APPIMAGE"
          popd >/dev/null
          rm -rf "$work"

          # Verify the repacked AppImage carries the pristine binary.
          verify=$(mktemp -d)
          pushd "$verify" >/dev/null
          "$APPIMAGE" --appimage-extract >/dev/null
          repaired_size=$(stat -c%s squashfs-root/usr/bin/ant)
          pristine_size=$(stat -c%s "$PRISTINE")
          if [ "$repaired_size" != "$pristine_size" ]; then
            echo "ERROR: repaired ant size ($repaired_size) != pristine ($pristine_size)" >&2
            exit 1
          fi
          squashfs-root/usr/bin/ant --version
          popd >/dev/null
          rm -rf "$verify"
          echo "Repair verified."

          # Re-sign for the updater. `tauri signer sign` reads the key
          # and password from TAURI_SIGNING_PRIVATE_KEY{,_PASSWORD} env
          # and writes <file>.sig next to the input.
          rm -f "$APPIMAGE.sig"
          npx tauri signer sign "$APPIMAGE"

      - name: build portable Linux tar.gz
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail

          # Portable archive: main exe + ant sidecar + bootstrap_peers
          # resource, mirroring what's inside the macOS .app.tar.gz.
          # Not consumed by Tauri's updater (Linux auto-updates via the
          # .AppImage directly); published purely for release-page
          # symmetry with the macOS assets.

          work=$(mktemp -d)
          pkg="$work/autonomi"
          mkdir -p "$pkg/resources"
          cp src-tauri/target/release/ant-gui "$pkg/ant-gui"
          cp src-tauri/binaries/ant-x86_64-unknown-linux-gnu "$pkg/ant"
          cp src-tauri/resources/bootstrap_peers.toml "$pkg/resources/bootstrap_peers.toml"
          chmod +x "$pkg/ant-gui" "$pkg/ant"

          out="$GITHUB_WORKSPACE/Autonomi_x64_linux.tar.gz"
          tar -C "$work" -czf "$out" autonomi

      - name: stage release assets
        shell: bash
        run: |
          set -euo pipefail

          # Collect all assets for this matrix entry into a single staging
          # directory so the artifact upload step has a stable path. The
          # publish-release job flattens artifacts from every build job and
          # uploads them to the GitHub release in one go.
          stage="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$stage"

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage     "$stage/"
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig "$stage/"
            cp src-tauri/target/release/bundle/deb/*.deb               "$stage/"
            cp src-tauri/target/release/bundle/deb/*.deb.sig           "$stage/"
            cp src-tauri/target/release/bundle/rpm/*.rpm               "$stage/"
            cp src-tauri/target/release/bundle/rpm/*.rpm.sig           "$stage/"
            cp "$GITHUB_WORKSPACE/Autonomi_x64_linux.tar.gz"           "$stage/"
          else
            # macOS: tauri-action emits Autonomi.app.tar.gz under target/<triple>/release/bundle/macos/.
            # Both matrix entries (x86_64 + aarch64) produce the same filename
            # and would collide when the publish-release job's download-artifact
            # step merges every release-assets-* artifact into one directory.
            # Rename with a platform suffix so both archs survive the merge
            # and the compose latest.json step finds them under the names it
            # expects (Autonomi_x64.app.tar.gz / Autonomi_aarch64.app.tar.gz).
            target=$(echo "${{ matrix.args }}" | sed -n 's/.*--target \([^ ]*\).*/\1/p')
            case "$target" in
              x86_64-apple-darwin)  suffix="x64" ;;
              aarch64-apple-darwin) suffix="aarch64" ;;
              *) echo "Unsupported macOS target: $target" >&2; exit 1 ;;
            esac
            src=src-tauri/target/"$target"/release/bundle/macos
            cp "$src/Autonomi.app.tar.gz"     "$stage/Autonomi_${suffix}.app.tar.gz"
            cp "$src/Autonomi.app.tar.gz.sig" "$stage/Autonomi_${suffix}.app.tar.gz.sig"
            # Tauri names the DMG with the platform suffix already (e.g.
            # Autonomi_<version>_x64.dmg), so no rename needed.
            cp src-tauri/target/"$target"/release/bundle/dmg/*.dmg "$stage/"
          fi

          echo "Staged assets:"
          ls -l "$stage"

      - name: upload release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets-${{ matrix.slug }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build windows MSI (signed)
    # Pinned to windows-2022 (VS2022) so the auto-migration of `windows-latest`
    # to a VS2026-based image (announced for 2026-06-15) can't break a release
    # mid-flight. Revisit windows-2025 in a separate PR with a clean test run
    # before the eventual VS2022 EOL.
    runs-on: windows-2022
    needs: [release-meta, resolve-ant-version]
    env:
      SM_HOST: ${{ secrets.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
      SM_LOG_LEVEL: trace
      SM_LOG_FILE: ${{ github.workspace }}\smctl-signing.log
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm install

      - name: download ant daemon sidecar
        env:
          ANT_VERSION: ${{ needs.resolve-ant-version.outputs.ant_version }}
          ANT_TAG: ${{ needs.resolve-ant-version.outputs.ant_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TARGET="x86_64-pc-windows-msvc"
          ASSET="ant-${ANT_VERSION}-${TARGET}.zip"
          echo "Downloading $ASSET from $ANT_TAG"

          mkdir -p src-tauri/binaries
          gh release download "$ANT_TAG" \
            --repo WithAutonomi/ant-client \
            --pattern "$ASSET" \
            --dir "$RUNNER_TEMP"

          cd "$RUNNER_TEMP" && unzip -o "$ASSET"
          cp "$RUNNER_TEMP/ant-${ANT_VERSION}-${TARGET}/ant.exe" \
            "$GITHUB_WORKSPACE/src-tauri/binaries/ant-${TARGET}.exe"
          echo "Sidecar ready: src-tauri/binaries/ant-${TARGET}.exe"

          # Bundle the bootstrap_peers.toml that ships with this daemon version
          # so the GUI's embedded ant-core client can connect on a fresh install.
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/resources"
          cp "$RUNNER_TEMP/ant-${ANT_VERSION}-${TARGET}/bootstrap_peers.toml" \
            "$GITHUB_WORKSPACE/src-tauri/resources/bootstrap_peers.toml"
          echo "Bootstrap peers refreshed from $ANT_TAG"

      - name: create client certificate file
        shell: pwsh
        run: |
          $raw = @'
          ${{ secrets.SM_CLIENT_CERT_B64 }}
          '@

          $clean = ($raw -replace '\s','')

          if ([string]::IsNullOrWhiteSpace($clean)) {
            Write-Error "SM_CLIENT_CERT_B64 is empty after normalization."
            exit 1
          }

          try {
            $certBytes = [Convert]::FromBase64String($clean)
          } catch {
            Write-Error "SM_CLIENT_CERT_B64 is not valid Base64."
            exit 1
          }

          $certPath = Join-Path $env:RUNNER_TEMP "Certificate.p12"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          "SM_CLIENT_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: setup DigiCert SSM tools
        # The action accepts only `force-download-tools` as input — all
        # credentials are read from env vars: SM_HOST / SM_API_KEY /
        # SM_CLIENT_CERT_PASSWORD are set at job scope above, and
        # SM_CLIENT_CERT_FILE is exported by the create-client-certificate
        # step. Passing the same values via `with:` used to emit a noisy
        # "Unexpected input(s)" warning on every release build.
        uses: digicert/ssm-code-signing@v1.2.1

      - name: verify smctl installation
        shell: pwsh
        run: |
          smctl -v
          smctl healthcheck

      - name: create signing script
        shell: pwsh
        run: |
          # Create a batch script for Tauri's signCommand hook.
          # "%~1" strips any surrounding quotes then re-quotes, safe for paths with spaces.
          $script = @"
          @echo off
          smctl sign --keypair-alias "$env:SM_KEYPAIR_ALIAS" --input "%~1"
          if %ERRORLEVEL% neq 0 exit /b 1
          "@
          Set-Content -Path "sign.cmd" -Value $script

      - name: build and bundle MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $signCmd = (Resolve-Path "sign.cmd").Path -replace '\\', '/'

          # Windows MSI versioning rejects non-numeric pre-release identifiers
          # (e.g. `0.6.5-rc.1`), because the MSI format inherits the 4-part
          # numeric PE resource version. Tauri errors with: "optional pre-release
          # identifier in app version must be numeric-only". Override wix.version
          # with just the `major.minor.patch` portion so `rc.N` / `beta.N` tags
          # can still ship an MSI. The app's self-reported version (CARGO_PKG_VERSION
          # / tauri.conf.json) keeps the full semver — the override only affects
          # MSI metadata (what Windows' Add/Remove Programs displays).
          $conf = Get-Content src-tauri\tauri.conf.json | ConvertFrom-Json
          $msiVersion = ($conf.version -split '-')[0]
          Write-Host "MSI wix.version override: $msiVersion (from tauri.conf.json '$($conf.version)')"

          $overrideJson = @{
            bundle = @{
              windows = @{
                signCommand = "$signCmd %1"
                wix = @{
                  version = $msiVersion
                }
              }
            }
          } | ConvertTo-Json -Depth 5 -Compress

          # Tauri replaces %1 in signCommand with the file path, then executes
          # the result as a shell command. sign.cmd receives that path as its
          # first arg (%1).
          npx tauri build --bundles msi,updater --config $overrideJson
          Remove-Item -Path "sign.cmd" -ErrorAction SilentlyContinue

      - name: verify MSI signature
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $msi.FullName
          Write-Host "MSI: $($msi.Name)"
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            Write-Error "MSI Authenticode signature validation failed"
            exit 1
          }

      - name: build portable Windows tar.gz
        shell: bash
        run: |
          set -euo pipefail

          # Portable archive: main exe + ant sidecar + bootstrap_peers
          # resource, mirroring what's inside the macOS .app.tar.gz.
          # Not consumed by Tauri's updater (Windows auto-updates via the
          # .msi directly); published purely for release-page symmetry
          # with the macOS assets.

          work=$(mktemp -d)
          pkg="$work/autonomi"
          mkdir -p "$pkg/resources"
          cp src-tauri/target/release/ant-gui.exe "$pkg/ant-gui.exe"
          cp src-tauri/binaries/ant-x86_64-pc-windows-msvc.exe "$pkg/ant.exe"
          cp src-tauri/resources/bootstrap_peers.toml "$pkg/resources/bootstrap_peers.toml"

          out="$GITHUB_WORKSPACE/Autonomi_x64_windows.tar.gz"
          # --force-local: $GITHUB_WORKSPACE starts with "D:\...", which GNU tar
          # otherwise treats as an rsh-style host:path spec and tries to dial.
          tar --force-local -C "$work" -czf "$out" autonomi

      - name: stage release assets
        shell: bash
        run: |
          set -euo pipefail

          stage="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$stage"

          cp src-tauri/target/release/bundle/msi/*.msi      "$stage/"
          cp src-tauri/target/release/bundle/msi/*.msi.sig  "$stage/"
          cp "$GITHUB_WORKSPACE/Autonomi_x64_windows.tar.gz" "$stage/"

          echo "Staged assets:"
          ls -l "$stage"

      - name: upload release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: upload signing logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: signing-logs
          path: ${{ github.workspace }}\smctl-signing.log
          if-no-files-found: ignore

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [release-meta, build-linux-macos, build-windows]
    steps:
      - name: download all build artifacts
        uses: actions/download-artifact@v5
        with:
          # Download every artifact uploaded by the build jobs
          # (release-assets-linux, release-assets-macos-aarch64,
          # release-assets-macos-x86_64, release-assets-windows) and flatten
          # them into a single directory so subsequent steps see one path.
          path: assets
          pattern: release-assets-*
          merge-multiple: true

      - name: list downloaded assets
        run: |
          echo "Downloaded assets:"
          ls -l assets

      - name: create published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.release-meta.outputs.version }}"

          prerelease_flag=""
          if [ "${{ needs.release-meta.outputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          # No --draft: this creates a published (or published pre-release)
          # GitHub release. `gh release create` always attaches the pushed
          # tag to the release object from creation, so latest.json URLs
          # composed below resolve correctly.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Autonomi v${{ needs.release-meta.outputs.version }}" \
            --generate-notes \
            $prerelease_flag

      - name: upload built assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.release-meta.outputs.version }}"
          gh release upload "$tag" assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: compose latest.json from scratch
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          read_sig() {
            local path="assets/$1"
            if [ ! -s "$path" ]; then
              echo "ERROR: signature file missing or empty: $path" >&2
              ls -l assets >&2
              exit 1
            fi
            cat "$path"
          }

          mac_x64_sig=$(read_sig "Autonomi_x64.app.tar.gz.sig")
          mac_aarch64_sig=$(read_sig "Autonomi_aarch64.app.tar.gz.sig")
          linux_appimage_sig=$(read_sig "Autonomi_${VERSION}_amd64.AppImage.sig")
          linux_deb_sig=$(read_sig "Autonomi_${VERSION}_amd64.deb.sig")
          linux_rpm_sig=$(read_sig "Autonomi-${VERSION}-1.x86_64.rpm.sig")
          win_sig=$(read_sig "Autonomi_${VERSION}_x64_en-US.msi.sig")

          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          jq -n \
            --arg version       "${VERSION}" \
            --arg pub_date      "${pub_date}" \
            --arg mac_x64_url   "${base}/Autonomi_x64.app.tar.gz" \
            --arg mac_arm_url   "${base}/Autonomi_aarch64.app.tar.gz" \
            --arg lx_app_url    "${base}/Autonomi_${VERSION}_amd64.AppImage" \
            --arg lx_deb_url    "${base}/Autonomi_${VERSION}_amd64.deb" \
            --arg lx_rpm_url    "${base}/Autonomi-${VERSION}-1.x86_64.rpm" \
            --arg win_url       "${base}/Autonomi_${VERSION}_x64_en-US.msi" \
            --arg mac_x64_sig   "${mac_x64_sig}" \
            --arg mac_arm_sig   "${mac_aarch64_sig}" \
            --arg lx_app_sig    "${linux_appimage_sig}" \
            --arg lx_deb_sig    "${linux_deb_sig}" \
            --arg lx_rpm_sig    "${linux_rpm_sig}" \
            --arg win_sig       "${win_sig}" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64":         {signature: $mac_x64_sig, url: $mac_x64_url},
                "darwin-x86_64-app":     {signature: $mac_x64_sig, url: $mac_x64_url},
                "darwin-aarch64":        {signature: $mac_arm_sig, url: $mac_arm_url},
                "darwin-aarch64-app":    {signature: $mac_arm_sig, url: $mac_arm_url},
                "linux-x86_64":          {signature: $lx_app_sig,  url: $lx_app_url},
                "linux-x86_64-appimage": {signature: $lx_app_sig,  url: $lx_app_url},
                "linux-x86_64-deb":      {signature: $lx_deb_sig,  url: $lx_deb_url},
                "linux-x86_64-rpm":      {signature: $lx_rpm_sig,  url: $lx_rpm_url},
                "windows-x86_64":        {signature: $win_sig,     url: $win_url}
              }
            }' > latest.json

          echo "--- composed latest.json ---"
          jq . latest.json

      - name: assert latest.json integrity
        run: |
          # Defends against unsubstituted `__VERSION__` templates and
          # GitHub's `untagged-*` placeholder slug, plus empty/null
          # signatures and platform-key drift.
          if jq -e '.platforms | to_entries[] | select(.value.url | test("__VERSION__|/releases/download/untagged-"))' latest.json > /dev/null; then
            echo "ERROR: latest.json contains broken URLs (__VERSION__ or untagged-*)" >&2
            jq '.platforms' latest.json >&2
            exit 1
          fi
          if jq -e '.platforms | to_entries[] | select(.value.signature == "" or .value.signature == null)' latest.json > /dev/null; then
            echo "ERROR: latest.json contains empty signatures" >&2
            jq '.platforms' latest.json >&2
            exit 1
          fi
          expected_platforms='["darwin-aarch64","darwin-aarch64-app","darwin-x86_64","darwin-x86_64-app","linux-x86_64","linux-x86_64-appimage","linux-x86_64-deb","linux-x86_64-rpm","windows-x86_64"]'
          actual_platforms=$(jq -c '.platforms | keys' latest.json)
          if [ "$actual_platforms" != "$expected_platforms" ]; then
            echo "ERROR: latest.json platforms mismatch" >&2
            echo "expected: $expected_platforms" >&2
            echo "actual:   $actual_platforms" >&2
            exit 1
          fi
          echo "latest.json passed integrity checks"

      - name: upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.release-meta.outputs.version }}"
          gh release upload "$tag" latest.json --clobber --repo "$GITHUB_REPOSITORY"
